<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>LOGIN — OBOX Toolbox</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/obox-logo.png') }}">
</head>

<body class="login-page">

    <canvas id="matrix"></canvas>

    <!-- ===================== HEADER ===================== -->
    <header class="header">
        <div class="header-left" style="width:60px;"></div>
        <div class="header-center">
            <h1>⚡ OBOX – TOOLBOX DE PENTEST ⚡</h1>
            <p>Projet M1 - Cybersécurité 2026</p>
        </div>
        <div class="header-right">
            <img src="{{ url_for('static', filename='images/obox-logo.png') }}" alt="OBOX Logo" class="header-logo" />
        </div>
    </header>
    <!-- ===================== FIN HEADER ===================== -->


    <!-- ===================== CONTENU LOGIN ===================== -->
    <main class="login-main">
        <section class="box login-box">

            <div class="login-logo-wrapper">
                <img src="{{ url_for('static', filename='images/obox-logo.png') }}" alt="OBOX Logo" class="login-logo" />
            </div>

            <h2 class="login-title">CONNEXION</h2>
            <p class="login-subtitle">Accès réservé aux opérateurs autorisés</p>

            {% if error %}
                <div class="login-error">{{ error }}</div>
            {% endif %}

            <form method="POST" class="login-form">
                <div class="login-field">
                    <label for="username">Identifiant</label>
                    <input type="text" id="username" name="username" placeholder="Entrez votre identifiant" required autofocus>
                </div>
                <div class="login-field">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required>
                </div>
                <button type="submit" class="login-btn">CONNEXION</button>
            </form>

        </section>
    </main>
    <!-- ===================== FIN CONTENU LOGIN ===================== -->


    <footer>© 2026 – Projet Mastère Cybersécurité | Tous droits réservés</footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
